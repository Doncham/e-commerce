spring:
  sql:
    init:
      mode: always
  jpa:
    show-sql: true
    hibernate:
      format_sql: true
      highlight_sql: true
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    defer-datasource-initialization: true
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s
      database: 0
  redis:
    redisson:
      mode: file
      file: classpath:redisson.yml

app:
  datasource:
    primary:
      url: jdbc:mysql://localhost:6401/ecdb
      username: appuser
      password: app1234
      driver-class-name: com.mysql.cj.jdbc.Driver
    replica:
      url: jdbc:mysql://localhost:6402/ecdb
      username: appuser
      password: app1234
      driver-class-name: com.mysql.cj.jdbc.Driver
  redisson:
    enabled: true
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ecommerce-app
  endpoint:
    health:
      show-details: always
spring:
  sql:
    init:
      mode: always
  jpa:
    show-sql: true
    hibernate:
      format_sql: true
      highlight_sql: true
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    defer-datasource-initialization: true
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms
      database: 0
  redis:
    redisson:
      mode: file
      file: classpath:redisson.yml

app:
  datasource:
    primary:
      url: jdbc:mysql://localhost:6401/ecdb
      username: appuser
      password: app1234
      driver-class-name: com.mysql.cj.jdbc.Driver
    replica:
      url: jdbc:mysql://localhost:6402/ecdb
      username: appuser
      password: app1234
      driver-class-name: com.mysql.cj.jdbc.Driver
  redisson:
    enabled: true
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

server:
  tomcat:
    threads:
      max: 300
      min-spare: 50
    max-connections: 8192
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ecommerce-app
    distribution:
      percentiles-histogram:
        coupon.redis.lua: true
      percentiles:
        coupon.redis.lua: 0.95,0.99
      minimum-expected-value:
        coupon.redis.lua: 1ms
      maximum-expected-value:
        coupon.redis.lua: 5s
  endpoint:
    health:
      show-details: always

